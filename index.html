<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>As minhas plantas</title>
<meta name="description" content="As plantas que tenho, com a luz, a água e os cuidados de cada uma.">
<meta name="theme-color" content="#24422C">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=13">
</head>
<body>
<div class="wrap">

  <header>
    <div class="top-row">
      <div>
        <div class="eyebrow" id="eyebrow">Coleção pessoal</div>
        <h1>As minhas plantas</h1>
      </div>
    </div>

    <div class="tabs" id="tabs" role="tablist" aria-label="Onde estão as plantas">
      <button type="button" role="tab" data-tab="interior" aria-selected="true">Interior <span class="tab-n">0</span></button>
      <button type="button" role="tab" data-tab="exterior" aria-selected="false">Exterior <span class="tab-n">0</span></button>
    </div>

    <p class="summary" id="resumo"></p>
    <div class="sortbar" id="sortbar">
      <span class="sb-label">Ordenar</span>
      <button type="button" data-sort="nome" aria-pressed="true">Nome</button>
      <button type="button" data-sort="numero" aria-pressed="false">Número</button>
      <button type="button" data-sort="luz" aria-pressed="false">Luz</button>
      <button type="button" data-sort="agua" aria-pressed="false">Água</button>
      <button type="button" data-sort="sensor" aria-pressed="false">Sensor</button>
    </div>
  </header>

  <main class="grid" id="grid" aria-live="polite"></main>

  <footer>
    As minhas plantas · luz, água e cuidados de cada uma
  </footer>

</div>

<script src="app.js?v=11"></script>
</body>
</html>
